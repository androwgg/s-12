<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ركن | شاشة الموظفين</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">ركن</a>
    <p class="lead">شاشة الموظفين</p>
  </header>

  <main class="page wide">
    <section class="glass login" id="login-section" aria-labelledby="login-title" hidden>
      <h1 id="login-title">دخول الموظفين</h1>
      <p class="lead">اكتب الرقم السري لعرض الطلبات وتغيير حالتها.</p>
      <form class="inline-form" id="login-form" novalidate>
        <div class="field">
          <label for="pin">الرقم السري</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-describedby="login-error">
        </div>
        <button class="primary" type="submit">دخول</button>
      </form>
      <p class="error" id="login-error" role="alert" hidden></p>
    </section>

    <div id="board-section" hidden>
      <div class="board-head">
        <h1>طلبات قهوة اليوم</h1>
        <div class="board-actions">
          <p class="lead" id="brew-line"></p>
          <button class="quiet" id="logout" type="button">خروج</button>
        </div>
      </div>
      <p class="notice" id="notice" role="status" hidden></p>
      <div class="board">
        <section class="glass column" aria-labelledby="col-new">
          <h2 id="col-new">جديد <span class="count" id="count-new">0</span></h2>
          <ul class="cards" id="list-new"></ul>
        </section>
        <section class="glass column" aria-labelledby="col-preparing">
          <h2 id="col-preparing">قيد التحضير <span class="count" id="count-preparing">0</span></h2>
          <ul class="cards" id="list-preparing"></ul>
        </section>
        <section class="glass column" aria-labelledby="col-ready">
          <h2 id="col-ready">جاهز <span class="count" id="count-ready">0</span></h2>
          <ul class="cards" id="list-ready"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/staff.js"></script>
</body>
</html>
